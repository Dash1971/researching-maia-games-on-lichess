name: Validate and publish report

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test analysis
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify data and reproduce report
        run: |
          python3 scripts/build_rated_report.py
          test -s index.html
          test -s data/rated_summary.json
          test -s data/fan_insights.json
          test -s data/learning_insights.json
          git diff --exit-code -- index.html data/rated_summary.json data/fan_insights.json data/learning_insights.json
      - name: Verify casual supplement from both published corpora
        run: |
          python3 scripts/build_casual_comparison.py
          test -s casual-vs-rated.html
          test -s data/casual_comparison.json
          test -s data/casual_comparison_monthly.csv
          git diff --exit-code -- casual-vs-rated.html data/casual_comparison.json data/casual_comparison_monthly.csv
      - name: Stage public report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html maia-fan-report.pdf casual-vs-rated.html 20261008_v0_maia_casual_comparison.pdf README.md RESEARCH_PLAN.md _site/
          cp -R data _site/data
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
